<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orally · 模型配置</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <aside class="rail">
        <img class="brand-mark" src="./assets/orally-icon.svg" alt="Orally" />
        <nav class="nav-list" aria-label="主导航">
          <button class="nav-item active" data-page="home" type="button" aria-label="模型配置">
            <span class="nav-icon" aria-hidden="true">AI</span>
            <span>配置</span>
          </button>
          <button class="nav-item" data-page="settings" type="button" aria-label="应用设置">
            <span class="nav-icon" aria-hidden="true">⚙</span>
            <span>设置</span>
          </button>
        </nav>
        <span class="rail-caption">Orally</span>
      </aside>

      <section class="workspace">
        <header class="topbar configuration-toolbar">
          <h1 id="page-title">模型配置</h1>
          <label class="config-picker">
            <span>当前配置</span>
            <select id="config-select" aria-label="切换配置"></select>
          </label>
          <div class="top-actions">
            <button id="new-config" class="ghost" type="button">新建</button>
            <button id="import-config" class="ghost" type="button">导入</button>
            <button id="export-config" class="ghost" type="button" title="导出当前配置为 JSON，包含已填写的 API Key">导出</button>
            <button id="reload" class="icon-button" type="button" title="重新载入已保存配置" aria-label="重新载入已保存配置">↻</button>
            <button id="test-config" class="tonal" type="button">测试</button>
            <button id="save" class="filled" type="button">保存配置</button>
            <input id="config-import-file" type="file" accept=".json,.toml,application/json" hidden />
          </div>
        </header>

        <section id="home-page" class="page active" data-title="模型配置">
          <div class="config-detail-bar">
            <label class="config-name-label">
              <span>配置名称</span>
              <input id="config-name" placeholder="为这套配置命名" maxlength="80" autocomplete="off" />
            </label>
            <span id="config-state" class="config-state" role="status" aria-live="polite">已保存</span>
          </div>

          <div class="configuration-stack">
            <section class="configuration-panel recognition-panel" aria-labelledby="recognition-title">
              <header class="panel-heading">
                <span class="stage-symbol recognition-symbol" aria-hidden="true">ASR</span>
                <div>
                  <h2 id="recognition-title">语音识别</h2>
                </div>
              </header>
              <div class="service-fields recognition-fields">
                <label class="service-field service-url">
                  服务地址
                  <input id="asr-base-url" placeholder="https://api.example.com/v1" spellcheck="false" />
                </label>
                <label class="service-field service-model">
                  模型
                  <input id="asr-model" placeholder="模型名称" spellcheck="false" />
                </label>
                <div class="service-field service-key">
                  <label for="asr-api-key">API Key</label>
                  <span class="api-key-control">
                    <input id="asr-api-key" type="password" placeholder="API Key" autocomplete="off" spellcheck="false" />
                    <button id="toggle-asr-api-key" class="key-visibility-button" type="button" aria-label="显示 API Key" aria-pressed="false"></button>
                  </span>
                </div>
              </div>
              <div class="service-actions recognition-test-actions">
                <p id="asr-test-result" class="service-test-result" role="status" aria-live="polite"></p>
                <button id="test-asr-recording" class="tonal test-service-button" type="button">录音测试</button>
                <button id="test-asr-connection" class="ghost test-service-button" type="button">测试连接</button>
              </div>
            </section>

            <section class="configuration-panel postprocess-panel" aria-labelledby="postprocess-title">
              <header class="panel-heading">
                <span class="stage-symbol refinement-symbol" aria-hidden="true">AI</span>
                <div>
                  <h2 id="postprocess-title">后处理</h2>
                </div>
              </header>
              <div class="postprocess-mode-row">
                <label>
                  处理方式
                  <select id="postprocess-mode">
                    <option value="builtin">本地基础清理</option>
                    <option value="llm">AI 模型处理</option>
                  </select>
                </label>
              </div>
              <div id="postprocess-nodes" class="postprocess-nodes" aria-label="后处理模型节点"></div>
              <button id="add-model" class="tonal add-model-button" type="button">＋ 添加模型节点</button>
            </section>
          </div>
        </section>

        <section id="settings-page" class="page" data-title="应用设置">
          <div class="settings-layout">
            <section class="shortcuts-panel" aria-labelledby="shortcuts-title">
              <div class="settings-header">
                <div>
                  <h2 id="shortcuts-title">快捷键</h2>
                </div>
                <div class="settings-actions">
                  <button id="restore-shortcuts" class="ghost" type="button">恢复默认</button>
                </div>
              </div>

              <div class="shortcut-group">
                <div class="shortcut-row">
                  <div>
                    <strong>开始/停止听写</strong>
                  </div>
                  <button id="hotkey-capture" class="key-capture" type="button" aria-label="录入开始或停止听写的快捷键，当前组合：Ctrl + Alt + Space" aria-describedby="hotkey-capture-state" aria-pressed="false">Ctrl + Alt + Space</button>
                </div>
                <p id="hotkey-capture-state" class="hotkey-capture-state" role="status" aria-live="polite"></p>
              </div>
            </section>
              <details class="advanced-config runtime-panel" open>
                <summary>输出与隐私</summary>
                <div class="field-grid compact-grid">
                  <label>
                    粘贴延迟 ms
                    <input id="output-paste-delay-ms" type="number" min="0" max="5000" />
                  </label>
                  <label>
                    剪贴板恢复延迟 ms
                    <input id="output-restore-clipboard-delay-ms" type="number" min="0" max="5000" />
                  </label>
                </div>
                <label class="switch-row">
                  <span>输出原始转写</span>
                  <input id="output-raw" type="checkbox" />
                </label>
                <label class="switch-row">
                  <span>显示处理变更</span>
                  <input id="output-show-changes" type="checkbox" />
                </label>
                <label class="switch-row">
                  <span>默认直接粘贴</span>
                  <input id="output-insert" type="checkbox" />
                </label>
                <label class="switch-row">
                  <span>粘贴后恢复剪贴板</span>
                  <input id="output-restore-clipboard" type="checkbox" />
                </label>
                <label class="switch-row">
                  <span>允许外部 AI 请求</span>
                  <input id="privacy-allow-external-requests" type="checkbox" />
                </label>
                <label class="switch-row">
                  <span>保存本地历史</span>
                  <input id="privacy-history-enabled" type="checkbox" />
                </label>
                <label>
                  历史路径
                  <input id="privacy-history-path" placeholder="留空则使用默认 history.jsonl" spellcheck="false" />
                </label>
              </details>
          </div>
        </section>

        <p id="status" class="status" role="status" aria-live="polite"></p>
      </section>
    </main>
    <dialog id="config-test-dialog" class="config-test-dialog" aria-labelledby="config-test-title">
      <header class="test-dialog-heading">
        <div>
          <h2 id="config-test-title">语音输入测试</h2>
        </div>
        <button id="config-test-close" class="icon-button" type="button" aria-label="关闭测试">×</button>
      </header>
      <div class="test-dialog-body">
        <label class="test-mode-field">
          <span>测试方式</span>
          <select id="config-test-mode">
            <option value="voice">语音输入 · 完整流程</option>
            <option value="asr">录音 · 仅语音识别</option>
            <option value="text">文本 · 后处理</option>
          </select>
        </label>
        <label id="config-test-text-field" class="textarea-field" hidden>
          输入文本
          <textarea id="config-test-text" rows="3" placeholder="输入要测试的转写文本…">嗯，今天我们讨论了新版本的安排，然后然后决定先完成配置页面，再检查语音输入的效果。</textarea>
        </label>
        <div id="config-test-recording-field" class="test-recording-panel">
          <span class="test-recording-symbol" aria-hidden="true">●</span>
          <div class="test-recording-copy">
            <strong id="config-test-recording-status">准备录音</strong>
          </div>
          <output id="config-test-timer" class="test-recording-timer" role="timer" aria-label="录音时长" aria-live="off">00:00</output>
        </div>
        <div class="test-run-row">
          <p id="config-test-status" role="status" aria-live="polite"></p>
          <div class="test-run-actions">
            <button id="cancel-config-test" class="ghost" type="button" hidden>取消测试</button>
            <button id="run-config-test" class="filled" type="button">开始录音</button>
          </div>
        </div>
        <div id="config-test-results" class="config-test-results" hidden>
          <label id="config-test-raw-field" class="textarea-field" hidden>
            <span id="config-test-raw-label">识别文本</span>
            <textarea id="config-test-raw" rows="3" readonly></textarea>
          </label>
          <label id="config-test-final-field" class="textarea-field">
            <span id="config-test-final-label">最终输出</span>
            <textarea id="config-test-final" rows="6" readonly></textarea>
          </label>
        </div>
      </div>
    </dialog>
    <script src="./app.js" type="module"></script>
  </body>
</html>
