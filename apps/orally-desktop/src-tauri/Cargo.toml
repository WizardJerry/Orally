[package]
name = "orally-desktop"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[build-dependencies]
tauri-build = { version = "2.5.2", features = [] }

[dependencies]
orally-asr = { path = "../../../crates/orally-asr" }
orally-audio = { path = "../../../crates/orally-audio" }
orally-config = { path = "../../../crates/orally-config" }
orally-core = { path = "../../../crates/orally-core" }
orally-llm = { path = "../../../crates/orally-llm" }
orally-storage = { path = "../../../crates/orally-storage" }
orally-windows = { path = "../../../crates/orally-windows" }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2.10.1", features = ["tray-icon"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
